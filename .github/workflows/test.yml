name: offline tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: npm test (no Aside, no seller account, no network)
        env:
          PYTHONUTF8: "1"
        run: npm test
      - name: CLI help runs
        run: |
          node bin/alibaba-data.mjs --help
          node bin/alibaba-inquiry.mjs --help
          node bin/alibaba-accio.mjs help
          node bin/alibaba-accio.mjs features --tested 됨 --format csv
